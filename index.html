<style>
:root{
  --bg-a:#0a0f1e; --bg-b:#101a35;
  --glass:rgba(255,255,255,0.06);
  --glass-strong:rgba(255,255,255,0.09);
  --glass-border:rgba(255,255,255,0.12);
  --glass-glow:rgba(120,160,255,0.18);
  --orb-1:rgba(37,99,235,0.35);
  --orb-2:rgba(129,140,248,0.28);
  --orb-3:rgba(14,165,165,0.22);
  --ink:#e8edf7; --muted:#99a3b8;
  --accent:#60a5fa; --good:#22c55e; --warn:#eab308;
  --r:1.25rem;
  --hh:3.9rem;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html{background:var(--bg-a);color-scheme:dark}
body{
  background:linear-gradient(160deg,var(--bg-a),var(--bg-b));
  color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
  font-family:var(--sans);line-height:1.55;
}
/* Blurred color orbs behind the glass layers (same recipe as Devicera) —
   the backdrop blur needs strong color variation behind it to be visible. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  filter:blur(90px);
  background:
    radial-gradient(circle 480px at -20px -40px,var(--orb-1),transparent 70%),
    radial-gradient(circle 420px at 100% 35%,var(--orb-2),transparent 70%),
    radial-gradient(circle 380px at 35% 105%,var(--orb-3),transparent 70%);
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:1.2rem}
/* Sticky top header: blurred like the panels. */
header.site{
  position:sticky;top:0;z-index:30;
  background:rgba(10,15,30,.55);border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
}
.hin{display:flex;align-items:center;gap:1rem;max-width:1280px;margin:0 auto;padding:.7rem 1.2rem}
.logo{display:flex;align-items:center;gap:.55rem;font-size:1.7rem;font-weight:800;letter-spacing:.02em;line-height:1.2;flex-shrink:0}
.logo svg{width:2rem;height:2rem;flex-shrink:0;color:var(--accent)}
.logo span{background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--muted);font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layout{display:flex;gap:1.2rem;align-items:flex-start}
/* Sidebar: flat rows, border and tint only on hover, focus and active. */
nav.side{
  width:240px;flex-shrink:0;position:sticky;top:calc(var(--hh) + 1rem);
  max-height:calc(100vh - var(--hh) - 2rem);overflow-y:auto;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);
  padding:1rem .8rem;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  box-shadow:0 6px 24px rgba(0,0,0,.22);
}
.navgroup{margin-bottom:1.1rem}
.navgroup:last-child{margin-bottom:0}
.navgroup h3{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .3rem .7rem;white-space:nowrap}
.navgroup a{
  display:flex;align-items:center;gap:.65rem;padding:.45rem .7rem;border-radius:.75rem;
  color:var(--ink);text-decoration:none;font-size:.92rem;margin-bottom:.15rem;
  background:transparent;border:1px solid transparent;border-left:3px solid transparent;
  transition:background .15s,border-color .15s;
}
.navgroup a:last-child{margin-bottom:0}
.navgroup a:hover{background:rgba(255,255,255,.07);border-color:var(--glass-border)}
.navgroup a:focus-visible{background:rgba(255,255,255,.07)}
.navgroup a.active{
  background:rgba(255,255,255,.08);
  background:color-mix(in srgb,var(--accent) 15%,transparent);
  border-color:transparent;border-left-color:var(--accent);font-weight:600;
}
.ico{display:inline-flex;flex-shrink:0;color:var(--accent)}
.ico svg{width:1.15rem;height:1.15rem}
/* Main panel */
main.panel{
  flex:1;min-width:0;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);
  padding:1.8rem;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  box-shadow:0 6px 24px rgba(0,0,0,.22);
}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:viewin .35s ease both}
.panel h2{font-size:1.7rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.panel .sub{color:var(--muted);margin:.7rem 0 1.1rem;max-width:62ch;font-size:1rem}
/* Icon tile + group chip */
.tile{
  display:inline-grid;place-items:center;flex-shrink:0;width:3rem;height:3rem;border-radius:.95rem;
  color:var(--accent);background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
  background:color-mix(in srgb,var(--accent) 16%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
}
.tile svg{width:1.55rem;height:1.55rem}
.chip{
  display:inline-block;max-width:100%;font-size:.72rem;font-weight:600;letter-spacing:.01em;
  color:var(--ink);white-space:normal;overflow-wrap:anywhere;line-height:1.35;border-radius:999px;padding:.14rem .65rem;
  background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
  background:color-mix(in srgb,var(--accent) 14%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
}
/* App panel */
.apphead{display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}
.openbtn{
  display:inline-block;background:var(--accent);color:#0a0f1e;text-decoration:none;
  font-weight:700;padding:.55rem 1.3rem;border-radius:999px;font-size:.95rem;
  box-shadow:0 4px 18px rgba(0,0,0,.3);
  box-shadow:0 4px 18px color-mix(in srgb,var(--accent) 35%,transparent);
  transition:transform .15s,filter .15s;
}
.openbtn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.panel h4{
  display:flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:1.7rem 0 .65rem;
}
.panel h4::before{content:"";width:3px;height:.95em;border-radius:2px;background:var(--accent)}
ul.checks{list-style:none;display:grid;grid-template-columns:1fr;gap:.55rem;font-size:.92rem}
ul.checks li{
  position:relative;padding:.55rem .8rem .55rem 2.3rem;border-radius:.85rem;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border);
}
ul.checks li::before{
  content:"✓";position:absolute;left:.8rem;top:.55rem;font-weight:800;color:var(--accent);
}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.srcchip{
  display:inline-block;font-size:.8rem;color:var(--ink);padding:.25rem .8rem;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--glass-border);
}
.panel .chips .srcchip{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.samplenote{color:var(--muted);font-size:.8rem;margin-top:.7rem}
/* Sample table */
.tablewrap{overflow-x:auto;margin-top:.4rem;border:1px solid var(--glass-border);border-radius:.7rem}
table.sample{border-collapse:collapse;width:100%;font-size:.82rem}
table.sample th{
  text-align:left;padding:.45rem .6rem;background:rgba(255,255,255,.08);
  border-bottom:1px solid var(--glass-border);white-space:nowrap;position:sticky;top:0
}
table.sample td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
table.sample tr:hover td{background:rgba(255,255,255,.03)}
/* Export row (export-suite styling) */
.meta-row{display:flex;justify-content:space-between;align-items:center;margin:1rem 0 .6rem;gap:12px;flex-wrap:wrap}
.meta{font-size:.8rem;color:var(--muted)}
.qcount{color:#7dd3fc;font-size:.78rem;font-weight:600;margin-left:6px}
.dl-group{display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap}
.dl{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#cdd6ea;
  padding:4px 14px;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;
  transition:.2s;white-space:nowrap;flex-shrink:0}
.dl:hover{background:rgba(255,255,255,.15);border-color:var(--accent);color:#fff}
.qfilter{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:4px 14px;color:var(--ink);font-size:.78rem;width:190px}
.qfilter:focus{outline:none;border-color:var(--accent)}
/* Overview hero */
.hero{padding:.2rem 0 .4rem}
.herotitle{
  display:inline-block;font-size:clamp(2.6rem,7vw,4rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;
  background:linear-gradient(90deg,#60a5fa,#a78bfa 55%,#22d3ee);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .sub{font-size:1.08rem;margin:.8rem 0 1rem}
.badges{display:flex;flex-wrap:wrap;gap:.5rem}
.badge{
  display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:600;
  padding:.28rem .85rem;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--glass-border);
}
.badge::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--good)}
/* Overview grid */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:1rem;margin-top:1.4rem}
/* Cards sit inside the already-blurred main panel, where nested backdrop
   blur would sample a uniform surface and do nothing — depth comes from
   layered translucency instead: white-alpha gradient, an inset top light
   edge, and a real drop shadow (Devicera's .glass recipe). */
.ovcard{
  display:flex;flex-direction:column;gap:.65rem;color:var(--ink);
  background:linear-gradient(165deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid var(--glass-border);border-top:3px solid var(--accent);border-radius:var(--r);
  padding:1rem 1.1rem;
  box-shadow:0 6px 20px rgba(0,0,0,.22),inset 0 1px 0 var(--glass-border);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.ovcard:hover,.ovcard:focus-within{
  transform:translateY(-3px);
  border-color:var(--glass-border);border-top-color:var(--accent);
  box-shadow:0 0 0 1px var(--glass-border),0 12px 32px var(--glass-glow),
    0 8px 24px rgba(0,0,0,.28),inset 0 0 24px rgba(255,255,255,.03);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent),
    0 14px 34px color-mix(in srgb,var(--accent) 30%,transparent),
    0 8px 24px rgba(0,0,0,.28),inset 0 0 24px rgba(255,255,255,.03);
}
.cardhead{display:flex;align-items:center;gap:.75rem}
.cardhead > div{min-width:0}
.cardhead .tile{width:2.6rem;height:2.6rem;border-radius:.8rem}
.cardhead .tile svg{width:1.4rem;height:1.4rem}
.cardname{font-size:1.08rem;font-weight:700;line-height:1.25;margin-bottom:.2rem}
.ovcard p.tag{font-size:.85rem;color:var(--muted);line-height:1.5}
.ovcard p.src{font-size:.76rem;color:var(--muted);line-height:1.45}
.ovcard p.src b{color:var(--ink);font-weight:600}
.cardlinks{
  display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;
  margin-top:auto;padding-top:.75rem;border-top:1px solid var(--glass-border);
}
.cardlinks a{
  color:var(--ink);font-size:.82rem;font-weight:600;text-decoration:none;padding:.2rem 0;
  border-bottom:1px solid transparent;
}
.cardlinks a:hover{border-bottom-color:var(--accent)}
.cardlinks a.cardopen{padding:.25rem .8rem;border:1px solid var(--glass-border);border-radius:999px;background:rgba(255,255,255,.06)}
.cardlinks a.cardopen:hover{border-color:var(--accent);background:rgba(255,255,255,.1)}
.srcrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem;margin-top:1.6rem;padding-top:1.1rem;border-top:1px solid var(--glass-border)}
.srclabel{font-size:.78rem;color:var(--muted)}
footer.site{margin-top:1.4rem;padding:1.1rem .3rem;border-top:1px solid var(--glass-border);color:var(--muted);font-size:.78rem;line-height:1.6}
footer.site a{color:var(--muted)}
@media(min-width:900px){
  ul.checks{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .wrap{padding:.8rem}
  .hin{padding:.55rem .8rem}
  .logo{font-size:1.4rem}
  .logo svg{width:1.6rem;height:1.6rem}
  .tagline{font-size:.8rem}
  .layout{flex-direction:column;gap:.8rem}
  nav.side,main.panel,header.site{backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}
  nav.side{width:100%;max-width:100%;position:static;max-height:none;overflow:visible;padding:.5rem}
  main.panel{padding:1rem;width:100%}
  /* the menu is ONE horizontally scrollable chip row */
  #navGroups{display:flex;flex-wrap:nowrap;gap:.45rem;overflow-x:auto;padding:.1rem;scrollbar-width:thin}
  .navgroup{display:flex;flex-wrap:nowrap;gap:.45rem;margin:0;flex:0 0 auto}
  .navgroup h3{display:none}
  .navgroup a{
    flex:0 0 auto;white-space:nowrap;margin:0;padding:.4rem .85rem;border-radius:999px;
    border:1px solid var(--glass-border);
  }
  .navgroup a.active{
    background:rgba(255,255,255,.14);
    background:color-mix(in srgb,var(--accent) 30%,transparent);
    border-color:var(--accent);
  }
  .meta-row{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .ovcard:hover,.ovcard:focus-within,.openbtn:hover{transform:none}
}
</style>
</head>

      "Keyless openFDA queries"
    ],
    sources: "openFDA (drug enforcement)",
    bibType: "misc"
  },
  grantvera: {
    name: "Grantvera",
    tagline: "Research grant and funding search across NIH, NSF and Grants.gov.",
    url: "https://grantvera.pubvera.com/",
    color: "#facc15",
    icon: '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.6-.9-1.6-1.3-2.8-1.3-1.6 0-2.8.8-2.8 2.1 0 3 5.8 1.6 5.8 4.4 0 1.3-1.3 2.1-3 2.1-1.3 0-2.4-.5-3-1.4"/><path d="M12 6.5v1.4M12 16.1v1.4"/>',
    what: [
      "Search awarded grants by keyword across three federal sources",
      "Filter by minimum award amount and fiscal year",
      "PI and organization details per award",
      "Keyless, open data"
    ],
    sources: "NIH RePORTER, NSF Awards, Grants.gov",
    bibType: "misc"
  }
};

const GROUP_OF = {
  bibliovera:"Literature & evidence", praxvera:"Literature & evidence", corpova:"Literature & evidence",
  trialvera:"Trials & devices", devicera:"Trials & devices",
  retractis:"Safety & integrity", recallis:"Safety & integrity",
  grantvera:"Funding"
};

// Data sources shown as chips on the overview.
const DATA_SOURCES = ["OpenAlex", "Crossref", "ClinicalTrials.gov", "PubMed", "openFDA", "NIH", "NSF", "Grants.gov"];

/* ───────────────────────── Sample data + WYSIWYG views ─────────────────────────
   registerView stores, per app, the full sample rows and the current filter.
   Every export goes through exportRows() — the one shared filter chain — so
   what the visitor sees is exactly what downloads. */
const views = {};           // key -> {rows, cols, filter, meta}
function registerView(key, rows, meta){
  const cols = [];
  rows.forEach(r => Object.keys(r||{}).forEach(k => { if(!cols.includes(k)) cols.push(k); }));
  views[key] = {rows: rows, cols: cols, filter: "", meta: meta};
}
function exportRows(key){
  const v = views[key];
  if (!v) return [];
  const q = v.filter.trim().toLowerCase();
  if (!q) return v.rows;
  return v.rows.filter(r => v.cols.some(c => String(r[c]==null?"":r[c]).toLowerCase().includes(q)));
}
const samples = {};         // key -> loaded sample JSON (or null after failed load)
async function loadSample(key){
  if (key in samples) return samples[key];
  try {
    const res = await fetch("data/" + key + "-sample.json", {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    samples[key] = await res.json();
  } catch(e) {
    samples[key] = null;
  }
  return samples[key];
}

/* ───────────────────────── Rendering ───────────────────────── */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function prettyCol(c){
  return c.replace(/_/g," ").replace(/\b\w/g, ch => ch.toUpperCase());
}
function metaText(key){
  const v = views[key];
  const shown = exportRows(key).length;
  return "Pubvera hub · " + v.meta.app + " sample · query: \"" + v.meta.query + "\" · " +
    shown + " of " + v.rows.length + " rows · source: " + v.meta.source +
    " · sample captured " + v.meta.captured_at;
}
function renderTable(key){
  const v = views[key];
  const rows = exportRows(key);
  let h = "<table class=\"sample\"><thead><tr>";
  v.cols.forEach(c => h += "<th>" + esc(prettyCol(c)) + "</th>");
  h += "</tr></thead><tbody>";
  rows.forEach(r => {
    h += "<tr>";
    v.cols.forEach(c => {
      let val = r[c];
      if (val === true) val = "Yes";
      if (val === false || val == null) val = "";
      h += "<td>" + esc(val) + "</td>";
    });
    h += "</tr>";
  });
  h += "</tbody></table>";
  if (!rows.length) h += "<p class=\"samplenote\">No rows match the filter.</p>";
  return h;
}
function refreshTable(key){
  const tw = document.getElementById("tw_" + key);
  const mt = document.getElementById("mt_" + key);
  if (tw) tw.innerHTML = renderTable(key);
  if (mt) mt.textContent = metaText(key);
}

/* ───────────────────────── Icons + nav ───────────────────────── */
function iconSVG(key){
  const app = APPS[key];
  if (!app) return "";
  return "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" " +
         "stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\">" + app.icon + "</svg>";
}
function accentStyle(key){
  return "style=\"--accent:" + APPS[key].color + "\"";
}
function sourceList(sources){
  // split on commas that are NOT inside parentheses
  return String(sources).split(/,\s*(?![^()]*\))/).map(s => s.trim()).filter(Boolean);
}
function buildNav(){
  const groups = [];
  Object.keys(APPS).forEach(key => {
    let g = groups.find(x => x.name === GROUP_OF[key]);
    if (!g) { g = {name: GROUP_OF[key], keys: []}; groups.push(g); }
    g.keys.push(key);
  });
  let h = "";
  groups.forEach(g => {
    h += "<div class=\"navgroup\"><h3>" + esc(g.name) + "</h3>";
    g.keys.forEach(key => {
      h += "<a href=\"#" + key + "\" data-app=\"" + key + "\" " + accentStyle(key) + ">" +
           "<span class=\"ico\">" + iconSVG(key) + "</span><span>" + esc(APPS[key].name) + "</span></a>";
    });
    h += "</div>";
  });
  document.getElementById("navGroups").insertAdjacentHTML("beforeend", h);
}

function panelHTML(key){
  const app = APPS[key];
  let h = "<div class=\"view\" " + accentStyle(key) + ">";
  h += "<div class=\"apphead\"><span class=\"tile\">" + iconSVG(key) + "</span>" +
       "<h2>" + esc(app.name) + "</h2><span class=\"chip\">" + esc(GROUP_OF[key]) + "</span></div>";
  h += "<p class=\"sub\">" + esc(app.tagline) + "</p>";
  h += "<a class=\"openbtn\" href=\"" + app.url + "\" target=\"_blank\" rel=\"noopener noreferrer\">Open live app ↗</a>";
  h += "<h4>What it does</h4><ul class=\"checks\">";
  app.what.forEach(w => h += "<li>" + esc(w) + "</li>");
  h += "</ul>";
  h += "<h4>Data sources</h4><div class=\"chips\">";
  sourceList(app.sources).forEach(s => h += "<span class=\"srcchip\">" + esc(s) + "</span>");
  h += "</div>";
  h += "<h4>Sample result</h4>";
  h += "<div id=\"sample_" + key + "\"><p class=\"samplenote\">Loading sample…</p></div>";
  h += "<p class=\"samplenote\">This is a stored sample. Open the live app above for fresh, full results.</p>";
  h += "</div>";
  return h;
}

function cardHTML(key){
  const app = APPS[key];
  return "<article class=\"ovcard\" " + accentStyle(key) + ">" +
    "<div class=\"cardhead\"><span class=\"tile\">" + iconSVG(key) + "</span>" +
    "<div><h3 class=\"cardname\">" + esc(app.name) + "</h3><span class=\"chip\">" + esc(GROUP_OF[key]) + "</span></div></div>" +
    "<p class=\"tag\">" + esc(app.tagline) + "</p>" +
    "<p class=\"src\"><b>Sources:</b> " + esc(app.sources) + "</p>" +
    "<div class=\"cardlinks\">" +
    "<a href=\"#" + key + "\">Preview sample →</a>" +
    "<a class=\"cardopen\" href=\"" + app.url + "\" target=\"_blank\" rel=\"noopener noreferrer\">Open app ↗</a>" +
    "</div></article>";
}

function overviewHTML(){
  let h = "<div class=\"view\"><section class=\"hero\"><h1 class=\"herotitle\">Pubvera</h1>";
  h += "<p class=\"sub\">A family of eight open-data research tools for science, medicine and funding. " +
       "Each app queries public, keyless data sources — no logins, no API keys, no paywalls. " +
       "Pick a tool from the menu, preview a real sample result, then open the live app.</p>";
  h += "<div class=\"badges\"><span class=\"badge\">No login</span><span class=\"badge\">No API keys</span>" +
       "<span class=\"badge\">Open data</span></div></section>";
  h += "<div class=\"ovgrid\">";
  Object.keys(APPS).forEach(key => { h += cardHTML(key); });
  h += "</div>";
  h += "<div class=\"srcrow\"><span class=\"srclabel\">Built on open data from</span><span class=\"chips\">";
  DATA_SOURCES.forEach(s => h += "<span class=\"srcchip\">" + esc(s) + "</span>");
  h += "</span></div></div>";
  return h;
}

async function showPanel(key){
  const panel = document.getElementById("panel");
  if (!APPS[key]) key = "";
  const row = document.getElementById("navGroups");
  document.querySelectorAll("nav.side a[data-app]").forEach(a => {
    const on = a.dataset.app === key;
    a.classList.toggle("active", on);
    if (on) {
      a.setAttribute("aria-current", "page");
      // mobile chip row: keep the active chip in view
      if (row.scrollWidth > row.clientWidth) {
        const ar = a.getBoundingClientRect(), rr = row.getBoundingClientRect();
        row.scrollLeft += (ar.left - rr.left) - (rr.width - ar.width) / 2;
      }
    } else {
      a.removeAttribute("aria-current");
    }
  });
  if (!key) {
    panel.innerHTML = overviewHTML();
    return;
  }
  panel.innerHTML = panelHTML(key);
  const data = await loadSample(key);
  const box = document.getElementById("sample_" + key);
  if (!box) return; // user navigated away while loading
  if (!data || !Array.isArray(data.rows) || !data.rows.length) {
    box.innerHTML = "<p class=\"samplenote\">Sample data is unavailable right now — open the live app above for real results.</p>";
    return;
  }
  registerView(key, data.rows, data.meta);
  const base = key + "-sample";
  box.innerHTML =
    "<div class=\"meta-row\"><span class=\"meta\" id=\"mt_" + key + "\"></span>" +
    "<span class=\"dl-group\">" +
    "<input class=\"qfilter\" type=\"text\" placeholder=\"🔍 Filter results…\" id=\"qf_" + key + "\">" +
    "<button class=\"dl\" onclick=\"downloadBibTeX('" + key + "','" + base + ".bib')\">⬇ BibTeX</button>" +
    "<button class=\"dl\" onclick=\"downloadXLSX('" + key + "','" + base + ".xlsx')\">⬇ Excel</button>" +
    "<button class=\"dl\" onclick=\"downloadCSV('" + key + "','" + base + ".csv')\">⬇ CSV</button>" +
    "<button class=\"dl\" onclick=\"downloadJSON('" + key + "','" + base + ".json')\">⬇ JSON</button>" +
    "</span></div>" +
    "<div class=\"tablewrap\" id=\"tw_" + key + "\"></div>";
  document.getElementById("qf_" + key).addEventListener("input", function(){
    views[key].filter = this.value;
    refreshTable(key);
  });
  refreshTable(key);
}

/* ───────────────────────── Exports (export-suite) ───────────────────────── */
function toCSV(rows){
  const cols = [];
  rows.forEach(r => Object.keys(r||{}).forEach(k => { if(!cols.includes(k)) cols.push(k); }));
  const cell = v => {
    // Booleans exported as text so localized Excel never shows IGAZ/HAMIS.
    if (v===null||v===undefined||v===false) return "";
    if (v===true) return "Yes";
    let s = (typeof v==="object") ? JSON.stringify(v) : String(v);
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  };
  // "sep=," tells Excel the delimiter regardless of the user's locale.
  const lines = ["sep=,", cols.map(cell).join(",")];
  rows.forEach(r => lines.push(cols.map(c => cell(r?r[c]:"")).join(",")));
  return "﻿" + lines.join("\r\n");
}
function downloadCSV(key, filename){
  const rows = exportRows(key);
  if (!rows.length){ alert("No rows to export — clear the filter first."); return; }
  triggerDownload(new Blob([toCSV(rows)],{type:"text/csv;charset=utf-8"}), filename);
}
function downloadXLSX(key, filename){
  const rows = exportRows(key);
  if (!rows.length){ alert("No rows to export — clear the filter first."); return; }
  const cols = [];
  rows.forEach(r => Object.keys(r||{}).forEach(k => { if(!cols.includes(k)) cols.push(k); }));
  const aoa = [cols].concat(rows.map(r => cols.map(c => {
    const v = r ? r[c] : "";
    if (v===null||v===undefined||v===false) return "";
    if (v===true) return "Yes";
    return (typeof v==="object") ? JSON.stringify(v) : v;
  })));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // Long free text goes left-aligned and wide; short values centre.
  const colInfo = cols.map(c => {
    let max = String(c).length, sum = 0, cnt = 0;
    rows.forEach(r => { const v = r?r[c]:""; const L = String(v==null?"":v).length; if (L>max) max=L; sum+=L; cnt++; });
    const avg = cnt ? sum/cnt : 0;
    const isLong = (max>22)||(avg>18);
    return {wch: Math.min(Math.max(max+2,9), isLong?90:24), left: isLong};
  });
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const centerH = {vertical:"center",horizontal:"center",wrapText:false};
  for (let R=range.s.r; R<=range.e.r; R++){
    for (let C=range.s.c; C<=range.e.c; C++){
      const addr = XLSX.utils.encode_cell({r:R,c:C});
      if (!ws[addr]) continue;
      if (R===0){
        ws[addr].s = {font:{bold:true,color:{rgb:"FFFFFF"}},alignment:centerH,
          fill:{fgColor:{rgb:"4472C4"}},
          border:{bottom:{style:"thin",color:{rgb:"999999"}}}};
      } else {
        ws[addr].s = {alignment:{vertical:"center",
          horizontal:(colInfo[C]&&colInfo[C].left)?"left":"center",wrapText:false}};
      }
    }
  }
  ws["!cols"] = colInfo.map(ci => ({wch:ci.wch}));
  ws["!freeze"] = {xSplit:0, ySplit:1};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, views[key].meta.app);
  XLSX.writeFile(wb, filename);
}
function bibKey(r,i){
  const t = String(r.title||r.author||r.product||"item").split(/\s+/)[0].replace(/[^A-Za-z0-9]/g,"");
  const y = Number(r.year||r.fiscal_year||0)||"";
  return (t||"ref").toLowerCase()+(y||"")+"_"+(i+1);
}
function bibEsc(v){ return String(v==null?"":v).replace(/[{}\\]/g,"").trim(); }
function toBibTeXArticles(key, rows){
  const meta = views[key].meta;
  const out = [];
  rows.forEach((r,i) => {
    const title = bibEsc(r.title||"");
    if (!title) return;
    const doi = String(r.doi||"").replace(/^https?:\/\/(dx\.)?doi\.org\//i,"").trim();
    const year = Number(r.year||0);
    const journal = bibEsc(r.journal||"");
    const authors = bibEsc(r.authors||r.author||"");
    const lines = ["@article{"+bibKey(r,i)+","];
    lines.push("  title   = {"+title+"},");
    if (authors) lines.push("  author  = {"+authors+"},");
    if (journal) lines.push("  journal = {"+journal+"},");
    if (year)    lines.push("  year    = {"+year+"},");
    if (doi)     lines.push("  doi     = {"+doi+"},");
    if (doi)     lines.push("  url     = {https://doi.org/"+doi+"},");
    lines.push("  note    = {"+bibEsc(metaText(key))+"}");
    lines.push("}");
    out.push(lines.join("\n"));
  });
  return out.join("\n\n")+"\n";
}
function toBibTeXMisc(key, rows){
  const meta = views[key].meta;
  const y = new Date().getFullYear();
  return "@misc{pubvera_"+key+"_"+y+",\n"+
    "  title  = {"+bibEsc(meta.app+" sample: "+meta.query)+"},\n"+
    "  author = {{Pubvera "+bibEsc(meta.app)+"}},\n"+
    "  year   = {"+y+"},\n"+
    "  howpublished = {Pubvera research tools hub},\n"+
    "  note   = {"+bibEsc(metaText(key))+"; underlying data from "+bibEsc(meta.source)+"},\n"+
    "  url    = {"+APPS[key].url+"}\n"+
    "}\n";
}
function downloadBibTeX(key, filename){
  const rows = exportRows(key);
  if (!rows.length){ alert("No rows to export — clear the filter first."); return; }
  const text = (APPS[key].bibType === "article" && rows.some(r => r.title))
    ? toBibTeXArticles(key, rows.filter(r => r.title))
    : toBibTeXMisc(key, rows);
  triggerDownload(new Blob([text],{type:"application/x-bibtex;charset=utf-8"}), filename);
}
function downloadJSON(key, filename){
  const rows = exportRows(key);
  if (!rows.length){ alert("No rows to export — clear the filter first."); return; }
  const payload = {meta: Object.assign({}, views[key].meta, {origin: metaText(key)}), rows: rows};
  triggerDownload(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}), filename);
}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ───────────────────────── Routing + nav ───────────────────────── */
function route(){
  const key = location.hash.replace(/^#/,"");
  showPanel(APPS[key] ? key : "");
}
window.addEventListener("hashchange", route);
buildNav();
route();
</script>
